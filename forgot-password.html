<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forget Password | SkillBridge.AI</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body data-auth-page="forgot">
    <header class="site-header">
      <a class="brand" href="index.html#analyze" aria-label="SkillBridge.AI home">
        <span class="brand-mark" aria-hidden="true">SB</span>
        <span>SkillBridge.AI</span>
      </a>
      <nav class="nav-links" aria-label="Primary navigation">
        <a href="index.html#analyze">Analyze</a>
        <a href="index.html#jobs">Jobs</a>
        <a id="savedJobsNav" href="saved-jobs.html" hidden>Saved Jobs</a>
        <a href="index.html#contact-us">Contact-us</a>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch theme">
          <span id="themeIcon" class="theme-icon" aria-hidden="true"></span>
        </button>
        <button id="authNavBtn" class="nav-action" type="button">Login</button>
      </nav>
    </header>

    <main class="single-page-main">
      <section class="auth-zone" aria-labelledby="forgotTitle">
        <div class="auth-shell single-auth">
          <div class="section-heading center-heading">
            <p class="eyebrow">Password recovery</p>
            <h1 id="forgotTitle">Verify OTP and update password</h1>
            <p>Enter your Gmail address, receive a real OTP by email, and complete the reset within 60 seconds.</p>
          </div>
          <form id="forgotForm" class="auth-panel">
            <h3>Forget password</h3>
            <label>
              Username as gmail
              <input id="forgotEmail" type="email" placeholder="yourname@gmail.com" autocomplete="username" required>
            </label>
            <div class="auth-actions">
              <button id="sendOtpBtn" class="primary-button" type="button">Send OTP</button>
              <button id="resendOtpBtn" class="ghost-button" type="button" disabled>Resend OTP</button>
            </div>
            <p id="otpMessage" class="auth-message"></p>
            <label>
              OTP
              <input id="otpInput" type="text" inputmode="numeric" placeholder="Enter 6 digit OTP" required disabled>
            </label>
            <div class="auth-actions">
              <button id="verifyOtpBtn" class="ghost-button" type="button" disabled>Verify OTP</button>
            </div>
            <label>
              New password
              <input id="newPassword" type="password" placeholder="New password" autocomplete="new-password" required disabled>
            </label>
            <label>
              Confirm password
              <input id="confirmNewPassword" type="password" placeholder="Confirm password" autocomplete="new-password" required disabled>
            </label>
            <p id="forgotMessage" class="auth-message"></p>
            <div class="auth-actions">
              <button id="updatePasswordBtn" class="primary-button" type="submit" disabled>Update password</button>
              <button id="backToLoginFromForgot" class="ghost-button" type="button">Back to login</button>
            </div>
          </form>
        </div>
      </section>
    </main>

    <script src="page-common.js"></script>
    <script src="auth-pages.js"></script>
  </body>
</html>
