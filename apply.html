<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Apply | SkillBridge.AI</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html#analyze" aria-label="SkillBridge.AI home">
        <span class="brand-mark" aria-hidden="true">SB</span>
        <span>SkillBridge.AI</span>
      </a>
      <nav class="nav-links" aria-label="Primary navigation">
        <a href="index.html#analyze">Analyze</a>
        <a href="index.html#jobs">Jobs</a>
        <a id="savedJobsNav" href="saved-jobs.html" hidden>Saved Jobs</a>
        <a href="index.html#contact-us">Contact-us</a>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch theme">
          <span id="themeIcon" class="theme-icon" aria-hidden="true"></span>
        </button>
        <button id="authNavBtn" class="nav-action" type="button">Login</button>
      </nav>
    </header>

    <main class="single-page-main">
      <section class="auth-zone" aria-labelledby="applyTitle">
        <div class="auth-shell apply-shell">
          <div class="section-heading center-heading">
            <p class="eyebrow">Direct application</p>
            <h1 id="applyTitle">Apply for this exact recommended job</h1>
            <p>This page is created for the same job card you selected in SkillBridge.AI.</p>
          </div>
          <article id="applyJobCard" class="auth-panel">
            Loading job details...
          </article>
          <form id="applyForm" class="auth-panel">
            <h3>Application details</h3>
            <label>
              Full name
              <input id="applyName" type="text" placeholder="Siva" required>
            </label>
            <label>
              Email
              <input id="applyEmail" type="email" placeholder="yourname@gmail.com" required>
            </label>
            <label>
              Portfolio or resume link
              <input id="applyPortfolio" type="url" placeholder="https://...">
            </label>
            <label>
              Short note
              <textarea id="applyNote" rows="6" placeholder="Write a short note for this application."></textarea>
            </label>
            <p id="applyMessage" class="auth-message"></p>
            <div class="auth-actions">
              <button class="primary-button" type="submit">Submit application</button>
              <a id="sourceLink" class="ghost-button" href="#" target="_blank" rel="noreferrer">View source portal</a>
            </div>
          </form>
        </div>
      </section>
    </main>

    <script src="page-common.js"></script>
    <script src="apply.js"></script>
  </body>
</html>
